<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>SIMPUS-Mini | Tambah Buku</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../assets/css/style.css" />
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1d5b8a">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu"
                    aria-expanded="false"
                    aria-label="Buka menu navigasi"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Beranda</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="list.html">Daftar Buku</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="tambah.html">Tambah Buku</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../anggota/list.html">Daftar Anggota</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container my-4">
            <section class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="card-title mb-3" style="color: #1d5b8a">Tambah Buku</h2>
                    <form>
                        <div class="mb-3">
                            <label for="judul" class="form-label fw-semibold">Judul</label>
                            <input type="text" class="form-control" id="judul" name="judul" required />
                        </div>
                        <div class="mb-3">
                            <label for="pengarang" class="form-label fw-semibold">Pengarang</label>
                            <input
                                type="text"
                                class="form-control"
                                id="pengarang"
                                name="pengarang"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label for="tahun" class="form-label fw-semibold">Tahun Terbit</label>
                            <input
                                type="number"
                                class="form-control"
                                id="tahun"
                                name="tahun"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label for="isbn" class="form-label fw-semibold">ISBN</label>
                            <input type="text" class="form-control" id="isbn" name="isbn" required />
                        </div>
                        <div class="mb-3">
                            <label for="stok" class="form-label fw-semibold">Stok</label>
                            <input type="number" class="form-control" id="stok" name="stok" required />
                        </div>
                        <div class="mb-3">
                            <label for="kategori" class="form-label fw-semibold">Kategori</label>
                            <select class="form-select" name="kategori" id="kategori">
                                <option value="fiksi">Fiksi</option>
                                <option value="non-fiksi">Non-Fiksi</option>
                                <option value="referensi">Referensi</option>
                            </select>
                        </div>
                        <button type="submit" class="btn" style="background-color: #1d5b8a; color: #fff">
                            Simpan
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <footer class="text-center text-secondary py-4">
            <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3 (Bootstrap)</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
