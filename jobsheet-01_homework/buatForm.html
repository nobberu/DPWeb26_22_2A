<html>
    <head>
        <title>Membuat Form</title>
    </head>
    <body>
        <form method="POST" action="gambar.html">
            <h4>FORM</h4>
            <input
                type="text"
                name="var1"
                size="30"
                value="Enter your name here."
            />
            <br>
            <input
                type="text"
                name="var2"
                size="30"
                value="Enter your address here."
            />
            <br>
            <br>
            <b>Enter your password</b><br>
            <input type="password" name="var7" size="30"><br><br>
            
            <b>Enter your comment</b><br>
            <textarea name="var8" cols="30" rows="5">Fill this area...</textarea><br><br>

            <br /><br />
            <b>Are you a student?</b>
            <input type="checkbox" name="var3" />
            <br /><br />
            <b>How old are you?</b><br />
            <input type="radio" name="var4" value="r1" /> 10-15 <br />
            <input type="radio" name="var4" value="r2" /> 16-20 <br />
            <input type="radio" name="var4" value="r3" /> 21-25 <br /><br />

            <b>Which one do you have?</b><br />
            <input type="checkbox" name="vechicle1" value="r1" />I have a bike<br />
            <input type="checkbox" name="vechicle2" value="r2" />I have a car<br />
            <input type="checkbox" name="vechicle3" value="r3" />I have a boat<br />
            <input type="checkbox" name="vechicle4" value="r4" checked />I have a plane<br /><br />

            <b>Where are you from</b>
            <br>
            <select name="var6" size="2">
                <option value="BG">Bulgaria</option>
                <option value="UK">United Kingdom</option>
                <option value="USA">USA</option>
                <option value="IDN" selected>Indonesia</option>
            </select>
            
            <input type="submit" name="var5" value="Send" />
            <input type="reset" name="var5" value="Clear" />
        </form>
    </body>
</html>
