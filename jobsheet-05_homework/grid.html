<!doctype html>
<html>
    <head>
        <title>Grid</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                font-size: 20px;
                font-family: Arial, sans-serif;
                color: white;
                text-transform: uppercase;
                text-align: center;
            }

            .container {
                width: 600px;
                margin: 50px auto;
                border: 5px solid #333;
                box-sizing: border-box;
                padding: 5px;
                display: grid;
                grid-template-areas:
                    "header header"
                    "aside main"
                    "nav main"
                    "footer footer";
                grid-template-columns: 1fr 1.5fr;
                grid-template-rows: 1fr 1fr 1fr 1fr;
                grid-gap: 5px;
            }

            header {
                grid-area: header;
                background-color: #886308;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px 0;
            }

            aside {
                grid-area: aside;
                background-color: #2f93ff;
                padding: 60px 0;
            }

            nav {
                grid-area: nav;
                background-color: #e45765;
                padding: 100px 0;
            }

            main {
                grid-area: main;
                background-color: #ebaa77;
                box-sizing: border-box;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            footer {
                grid-area: footer;
                background-color: #666;
                padding: 20px 0;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>Header</header>
            <aside>Aside</aside>
            <nav>Nav</nav>
            <main>Main</main>
            <footer>Footer</footer>
        </div>
    </body>
</html>
