<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>SIMPUS-Mini | Tambah Anggota</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../assets/css/style.css" />
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1d5b8a">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu"
                    aria-expanded="false"
                    aria-label="Buka menu navigasi"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Beranda</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../buku/list.html">Daftar Buku</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../buku/tambah.html">Tambah Buku</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="list.html">Daftar Anggota</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="tambah.html">Tambah Anggota</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container my-4">
            <section class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="card-title mb-3" style="color: #1d5b8a">Tambah Anggota</h2>
                    <form>
                        <div class="mb-3">
                            <label for="nama" class="form-label fw-semibold">Nama</label>
                            <input type="text" class="form-control" id="nama" name="nama" required />
                        </div>
                        <div class="mb-3">
                            <label for="no_anggota" class="form-label fw-semibold">No. Anggota</label>
                            <input
                                type="text"
                                class="form-control"
                                id="no_anggota"
                                name="no_anggota"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label for="alamat" class="form-label fw-semibold">Alamat</label>
                            <input
                                type="text"
                                class="form-control"
                                id="alamat"
                                name="alamat"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label for="no_hp" class="form-label fw-semibold">No. HP</label>
                            <input type="text" class="form-control" id="no_hp" name="no_hp" required />
                        </div>
                        <button type="submit" class="btn" style="background-color: #1d5b8a; color: #fff">
                            Simpan
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <footer class="text-center text-secondary py-4">
            <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3 (Bootstrap)</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
